name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# New pushes to a pull request cancel its older runs; main runs always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests (includes the synthetic eval suite)
        run: cargo test --workspace --locked
      - name: Synthetic evaluation report
        run: |
          cargo run --release --locked -p subsyncer-eval -- synthetic --seeds 30 --compare | tee eval.txt
          {
            echo '## Synthetic evaluation (global-only vs piecewise)'
            echo '```'
            cat eval.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
