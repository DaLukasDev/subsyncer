# Attach Linux binaries (amd64, arm64) to the GitHub release for a tag.
# Binaries are glibc-linked (ONNX Runtime is statically linked in); the
# prebuilt ONNX Runtime needs glibc >= 2.38 and GCC 13+ libstdc++.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked -p subsyncer --target ${{ matrix.target }}
      - name: Smoke test
        run: ./target/${{ matrix.target }}/release/subsyncer --version
      - name: Package
        run: |
          name="subsyncer-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp target/${{ matrix.target }}/release/subsyncer README.md LICENSE-MIT LICENSE-APACHE THIRD_PARTY.md "$name/"
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: subsyncer-*.tar.gz*

  release:
    runs-on: ubuntu-24.04
    needs: binaries
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: subsyncer-*.tar.gz*
          generate_release_notes: true
