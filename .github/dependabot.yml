# Weekly dependency updates, grouped so each ecosystem is one pull request.
# Commits and pull request titles start with the ⬆️ gitmoji, like the rest
# of the history: "⬆️ Bump clap from 4.6.7 to 4.6.8".
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "⬆️"
    groups:
      cargo:
        patterns: ["*"]
        # ort is pinned to a release candidate whose API changes between
        # candidates: its updates come on their own.
        exclude-patterns: ["ort", "ort-*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "⬆️"
    groups:
      actions:
        patterns: ["*"]
