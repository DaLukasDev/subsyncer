# Example: subsyncer next to Bazarr.
#
# The one rule: subsyncer must see your media at the SAME paths as Bazarr
# (simplest), or translate them with SUBSYNCER_PATH_MAP.
services:
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ./bazarr/config:/config
      - /srv/media/movies:/movies
      - /srv/media/tv:/tv
    ports:
      - "6767:6767"
    restart: unless-stopped

  subsyncer:
    # :latest is the newest release; pin a version (e.g. :0.1.0) or use :edge
    # for the main branch.
    image: ghcr.io/dalukasdev/subsyncer:latest
    environment:
      - PUID=1000          # the user that owns your subtitle files
      - PGID=1000
      # - SUBSYNCER_API_KEY=change-me   # then add -H "X-Api-Key: change-me" to the Bazarr command
      # - SUBSYNCER_PATH_MAP=/tv=/media/tv,/movies=/media/movies
      # - SUBSYNCER_BACKUP=false        # don't keep <subtitle>.bak files
      # - SUBSYNCER_LOG_LEVEL=debug
    volumes:
      - ./subsyncer/data:/data          # cache + job history (SQLite)
      - /srv/media/movies:/movies       # same paths as in Bazarr
      - /srv/media/tv:/tv
    # Bazarr reaches subsyncer over the Compose network; publishing the port
    # is only needed to look at http://localhost:8080/jobs from the host.
    # ports:
    #   - "8080:8080"
    restart: unless-stopped
